[package]
name = "core-mod-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
velopack = "1.2.161"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
